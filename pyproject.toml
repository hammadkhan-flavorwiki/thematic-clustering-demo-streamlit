[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-nlp"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "en-core-web-sm",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "protobuf>=7.36.2",
    "pyarrow>=25.0.1",
    "pyspellchecker>=0.9.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.3",
    "scipy>=1.15.3",
    "sentence-transformers>=3.0",
    "sentencepiece>=0.2.2",
    "spacy>=3.7",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=4.40",
    "umap-learn>=0.5.12",
]

[project.scripts]
survey-nlp = "survey_nlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
